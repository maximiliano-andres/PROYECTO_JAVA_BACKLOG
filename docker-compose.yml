services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: extractor-info-db:latest
    container_name: extractor-info-db

    ports:
      - "2025:2025"

    environment:
      SERVER_PORT: 2025
      DB_SERVER: ${DB_SERVER:-host.docker.internal}
      DB_USERNAME: ${DB_USERNAME:-Maximiliano_Andres}
      DB_PASSWORD: ${DB_PASSWORD:-Maximiliano_Andres}
      DB_DATABASE: ${DB_DATABASE:-Rem_Municipal}
      DB_DATABASE_DOS: ${DB_DATABASE_DOS:-Rem_Honorarios}
      DB_DATABASE_TRES: ${DB_DATABASE_TRES:-Rem_MunPae}
      DB_DATABASE_CUATRO: ${DB_DATABASE_CUATRO:-Renta_RRHH}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2025/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: extractor-network