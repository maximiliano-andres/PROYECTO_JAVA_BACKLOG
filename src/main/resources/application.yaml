spring:
  application:
    name: ExtractorInfoDB

  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: jdbc:sqlserver://${DB_SERVER:MAXIMILIANO\SQLEXPRESS};databaseName=${DB_DATABASE_DOS:Rem_Honorarios};encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:Maximiliano_Andres}
    password: ${DB_PASSWORD:Maximiliano_Andres}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      pool-name: SQLServer-Pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 5000

server:
  port: 2025

# Configuración de base de datos profesional
# Estos valores pueden ser sobrescritos por variables de entorno (ej: DB_PASSWORD)
db:
  server: ${DB_SERVER:MAXIMILIANO\SQLEXPRESS}
  username: ${DB_USERNAME:Maximiliano_Andres}
  password: ${DB_PASSWORD:Maximiliano_Andres}
  databases:
    municipal: ${DB_DATABASE:Rem_Municipal}
    honorarios: ${DB_DATABASE_DOS:Rem_Honorarios}
    mun-pae: ${DB_DATABASE_TRES:Rem_MunPae}
    renta-rrhh: ${DB_DATABASE_CUATRO:Renta_RRHH}
