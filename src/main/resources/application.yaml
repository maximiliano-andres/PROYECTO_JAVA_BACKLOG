spring:
  application:
    name: ExtractorInfoDB

  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: jdbc:sqlserver://${DB_SERVER:host.docker.internal};databaseName=${DB_DATABASE_DOS:Rem_Honorarios};encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:Maximiliano_Andres}
    password: ${DB_PASSWORD:Maximiliano_Andres}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      pool-name: SQLServer-Pool
      maximum-pool-size: 10 # cantidad de conexiones activas a la base de datos
      minimum-idle: 2 # cantidad de conexiones inactivas a la base de datos
      connection-timeout: 30000 # tiempo maximo de espera para obtener una conexion
      idle-timeout: 600000 # tiempo maximo de inactividad de una conexion
      max-lifetime: 1800000 # tiempo maximo de vida de una conexion
      leak-detection-threshold: 60000 # umbral para detectar fugas (subido a 60s para soportar exportaciones largas)

server:
  port: 2025

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Configuración de base de datos profesional
# Estos valores pueden ser sobrescritos por variables de entorno (ej: DB_PASSWORD)
db:
  server: ${DB_SERVER:host.docker.internal}
  username: ${DB_USERNAME:Maximiliano_Andres}
  password: ${DB_PASSWORD:Maximiliano_Andres}
  databases:
    municipal: ${DB_DATABASE:Rem_Municipal}
    honorarios: ${DB_DATABASE_DOS:Rem_Honorarios}
    mun-pae: ${DB_DATABASE_TRES:Rem_MunPae}
    renta-rrhh: ${DB_DATABASE_CUATRO:Renta_RRHH}

app:
  excluded-databases:
    - master
    - model
    - msdb
    - tempdb