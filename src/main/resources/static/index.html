<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador Modo Prueba</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Mobile Toggle -->
    <button id="menuToggle" class="menu-toggle">☰</button>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <h2>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 21c-4.97 0-9-1.79-9-4s4.03-4 9-4 9 1.79 9 4-4.03 4-9 4Z"/>
                <path d="M3 7c0 2.21 4.03 4 9 4s9-1.79 9-4-4.03-4-9-4-9 1.79-9 4Z"/>
            </svg>
            Explorador de Datos
        </h2>

        <div id="dbList" class="db-list">
            <div class="loader"><div class="spinner"></div></div>
        </div>
    </aside>

    <!-- Main -->
    <main class="main-content">
        <header class="header">
            <div>
                <h1 id="currentDb">Seleccione una DB</h1>
                <p id="currentTable">Explorador de Metadatos</p>
            </div>
        </header>

        <section id="viewArea" class="view-area">
            <div class="empty-state">
                <p>Seleccione una base de datos para comenzar.</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
